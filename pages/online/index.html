<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yoletta Online · Subscription</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="/online/styles.css">
    <style>
      .subscribe-btn {
        display: block;
        width: 100%;
        padding: 14px 20px;
        margin-top: 20px;
        background: #1a73e8;
        color: white;
        border: none;
        border-radius: 999px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
      }
      .subscribe-btn:hover { background: #1666c7; }
      .subscribe-btn:disabled { opacity: 0.6; cursor: not-allowed; }
      .customer-form {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-top: 8px;
      }
      .customer-form input[type="text"],
      .customer-form input[type="tel"] {
        width: 100%;
        padding: 12px 14px;
        border: 1.5px solid var(--border, #e8e4de);
        border-radius: 12px;
        font-size: 1rem;
        font-family: inherit;
      }
      .terms-row {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        font-size: 0.85rem;
        color: var(--text-muted, #8a8278);
        line-height: 1.4;
        margin-top: 4px;
      }
      .terms-row input { margin-top: 3px; }
      .terms-row a { color: inherit; text-decoration: underline; }
      .site-footer {
        margin-top: 32px;
        text-align: center;
        font-size: 0.8rem;
        color: var(--text-muted, #8a8278);
        line-height: 1.6;
      }
      .site-footer a { color: inherit; }
    </style>
  </head>
  <body>
    <main class="page">
      <header class="studio-header">
        <img class="logo-mark" src="https://bot-telega.s3.il-central-1.amazonaws.com/payments/yoletta.jpeg" alt="">
        <h1 class="studio-name">yoletta online</h1>
        <p id="user-greeting" class="studio-tagline">Join the online club</p>
      </header>

      <input type="hidden" id="telegram-user-id">

      <div class="plans-grid">
        <div class="plan-card">
          <div class="plan-inner">
            <h2 class="plan-title">Monthly<br><span class="plan-freq">subscription</span></h2>
            <p class="plan-detail">Live classes in the private group. Auto-renews every month. Cancel anytime.</p>
            <div class="plan-price">
              <span>111<span class="plan-currency">₪</span></span>
              <span class="plan-tag">per month</span>
            </div>
          </div>
        </div>
      </div>

      <form id="customer-form" class="customer-form">
        <input type="text" id="customer-name" name="customer-name" placeholder="Full name" autocomplete="name" required>
        <input type="tel" id="customer-phone" name="customer-phone" placeholder="Phone number" autocomplete="tel" required>
        <label class="terms-row">
          <input type="checkbox" id="terms-agree" required>
          <span>I agree to the <a href="/online/terms.html" target="_blank" rel="noopener">Terms &amp; Conditions</a></span>
        </label>
        <div id="subscribe-container"></div>
      </form>
      <p id="status-message" class="status-message"></p>

      <footer class="site-footer">
        <p>Contact: <a href="tel:+972534257328">+972 53-425-7328</a></p>
        <p>Tel-Aviv Jaffa, Ha-Kharuv 23</p>
        <p><a href="/online/terms.html" target="_blank" rel="noopener">Terms &amp; Conditions</a></p>
      </footer>
    </main>
    <script src="/online/index.js"></script>
  </body>
</html>
